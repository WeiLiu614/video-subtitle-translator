[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subgen"
version = "0.1.0"
description = "Generate Simplified Chinese (.srt) subtitles for Japanese and English videos using local Whisper and Cloud LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "imageio-ffmpeg>=0.5.1",
    "google-genai>=1.0.0",
    "openai>=1.40.0",
]

[project.optional-dependencies]
mlx = [
    "mlx-whisper>=0.4.1",
]
faster-whisper = [
    "faster-whisper>=1.0.3",
]
all = [
    "mlx-whisper>=0.4.1",
    "faster-whisper>=1.0.3",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
subgen = "subgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"subgen.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
